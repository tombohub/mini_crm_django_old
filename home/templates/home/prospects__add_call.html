{% extends 'home/base.html' %}
{% block content %}
    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
                <div>
                    <div class="text-muted small mb-1">Phone number</div>
                    <a href="tel:{{ prospect.phone_number }}"
                       class="fs-4 text-decoration-none"
                       id="prospect-phone-link">{{ prospect.phone_number }}</a>
                </div>
                <button type="button"
                        class="btn btn-outline-secondary"
                        id="copy-phone-button"
                        data-phone-text="{{ prospect.phone_number }}">
                    <i class="bi bi-copy"></i> Copy
                </button>
            </div>
        </div>
    </div>
    <div class="hstack justify-content-between">
        <div class="d-inline">
            Prospect exists:
            <span id="exists_status">{{ prospect.existence_status }}</span>
            <span id="indicator" class="htmx-indicator spinner-border"></span>
        </div>
        <div>
            <button hx-get="{% url 'home:htmx' action='update_existence_status' %}?existence_status=exists&prospect_id={{ prospect.id }}"
                    hx-trigger="click"
                    hx-target="#exists_status"
                    hx-indicator="#indicator"
                    hx-disabled-elt="this"
                    class="btn btn-success">Yes</button>
            <button hx-get="{% url 'home:htmx' action='update_existence_status' %}?existence_status=does_not_exist&prospect_id={{ prospect.id }}"
                    hx-trigger="click"
                    hx-target="#exists_status"
                    hx-indicator="#indicator"
                    hx-disabled-elt="this"
                    class="btn btn-danger">No</button>
        </div>
    </div>
    <form method="post">
        <div class="vstack gap-2">
            {% csrf_token %}
            {% include 'home/_form_fields.html' with form=call_record_form %}
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
    <script>
        const copyPhoneButton = document.getElementById("copy-phone-button");

        if (copyPhoneButton) {
            copyPhoneButton.addEventListener("click", async () => {
                const phoneText = copyPhoneButton.dataset.phoneText;

                try {
                    await navigator.clipboard.writeText(phoneText);
                    copyPhoneButton.innerHTML = '<i class="bi bi-check2"></i> Copied';
                } catch (error) {
                    copyPhoneButton.innerHTML = '<i class="bi bi-x-circle"></i> Failed';
                }
            });
        }
    </script>
{% endblock content %}
