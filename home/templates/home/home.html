{% extends 'home/base.html' %}
{% block content %}
    <section class="py-4">
        <div class="mb-4">
            <h1 class="h3 mb-2">Cold Calls</h1>
            <p class="text-body-secondary mb-0">Choose where you want to continue.</p>
        </div>
        <div class="row g-3">
            <div class="col-md-6">
                <a class="card h-100 text-decoration-none shadow-sm" href="{% url 'home:prospects-list' %}">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-2">Prospects</h2>
                        <p class="card-text text-body-secondary mb-0">Browse and manage prospect records.</p>
                    </div>
                </a>
            </div>
            <div class="col-md-6">
                <a class="card h-100 text-decoration-none shadow-sm" href="{% url 'home:call-records' %}">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-2">Call Records</h2>
                        <p class="card-text text-body-secondary mb-0">Review logged calls and activity history.</p>
                    </div>
                </a>
            </div>
        </div>
    </section>
{% endblock content %}
